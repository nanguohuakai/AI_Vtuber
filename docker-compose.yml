version: "3.9"

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  main_app:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - ./:/app
    command: bash -lc "pip install -r app/requirements.txt && uvicorn app.main:app --host 0.0.0.0 --port 9000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - OLLAMA_URL=http://llm:11434/api/generate
      - TTS_URL=http://tts:9880/tts
    depends_on:
      - redis
    ports:
      - "9000:9000"

  llm:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"

  tts:
    image: ghcr.io/replace-with-your-gpt-sovits-image:latest
    ports:
      - "9880:9880"

  rvc:
    image: ghcr.io/replace-with-your-rvc-image:latest
    ports:
      - "8000:8000"
